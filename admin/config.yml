backend:
  name: git-gateway
  branch: main

# Editorial workflow = your approval queue.
# Entries move through: Draft -> In Review -> Ready, and only a publish makes them live.
publish_mode: editorial_workflow

# Where Decap stores uploaded images in the repo, and how they're referenced on the site
media_folder: "images"        # files saved here in the repo
public_folder: "/images"      # URL path the site uses to load them

collections:
  - name: "shows"
    label: "Shows"
    label_singular: "Show"
    folder: "_data/shows"      # each production becomes one file here
    create: true
    # New files are named "<year>-<title>.md" (e.g. 2027-the-nutcracker.md)
    # so a 2027 production never collides with — or gets confused for — its 2026 run.
    # Existing 2026 files keep their current names; nothing is renamed.
    slug: "{{show_year}}-{{slug}}"
    summary: "{{show_year}} · {{title}} — {{venue}} ({{county}})"
    sortable_fields: ["show_year", "title", "venue", "organization"]
    # The Shows list in the admin can be grouped and filtered by year.
    view_groups:
      - label: "Show Year"
        field: "show_year"
    view_filters:
      - label: "2026 shows"
        field: "show_year"
        pattern: "2026"
      - label: "2027 shows"
        field: "show_year"
        pattern: "2027"
      - label: "2028 shows"
        field: "show_year"
        pattern: "2028"
    description: >
      Each entry is ONE production and becomes ONE show card on the website.
      Set the SHOW YEAR first — it is the year of the production's first performance.
      Then add every performance date under "Performances"; leave each performance's
      Year blank unless it falls in a different year than the Show Year (a run that
      crosses New Year's). The card lists all dates in order and crosses each one off
      as it passes. After publishing, check frontrowmaryland.com/data-check.html —
      it flags any date whose weekday doesn't match (the tell-tale sign of a wrong year).
    fields:
      - label: "Show Year"
        name: "show_year"
        widget: "select"
        hint: "REQUIRED. The year of this production's FIRST performance. A Fall 2026 show is 2026; a Spring 2027 show is 2027. Choose it before entering dates."
        options:
          - { label: "2026", value: 2026 }
          - { label: "2027", value: 2027 }
          - { label: "2028", value: 2028 }

      - label: "Production Title"
        name: "title"
        widget: "string"
        hint: "The name of the show, e.g. 'A Christmas Carol'"

      - label: "Show Image"
        name: "image"
        widget: "image"
        required: false
        hint: "You add this. ~1100x660 landscape works best. Optional while drafting."

      - label: "Venue"
        name: "venue"
        widget: "string"
        hint: "e.g. 'Milburn Stone Theatre'"

      - label: "Organization / School"
        name: "organization"
        widget: "string"
        hint: "Who is producing it, e.g. 'Cecil Community College'"

      - label: "City"
        name: "city"
        widget: "string"
        hint: "e.g. 'North East, MD'"

      - label: "County"
        name: "county"
        widget: "select"
        options:
          - { label: "Harford", value: "harford" }
          - { label: "Cecil", value: "cecil" }
          - { label: "Baltimore County", value: "baltimore-county" }
          - { label: "Baltimore City", value: "baltimore-city" }
          - { label: "Carroll County", value: "carroll" }
          - { label: "Wicomico County", value: "wicomico" }
          - { label: "Worcester County", value: "worcester" }
          - { label: "St. Mary's County", value: "st-marys" }
          - { label: "Anne Arundel County", value: "anne-arundel" }
          - { label: "Washington County", value: "washington" }
          - { label: "Frederick County", value: "frederick" }
          - { label: "Howard County", value: "howard" }
          - { label: "Prince George's County", value: "prince-georges" }

      - label: "Season"
        name: "season"
        widget: "select"
        options:
          - { label: "Fall", value: "fall" }
          - { label: "Holiday", value: "holiday" }
          - { label: "Winter", value: "winter" }
          - { label: "Spring", value: "spring" }
          - { label: "Summer", value: "summer" }

      - label: "Genre"
        name: "genre"
        widget: "select"
        options:
          - { label: "Musical", value: "musical" }
          - { label: "Play", value: "play" }
          - { label: "Dance", value: "dance" }
          - { label: "Ballet", value: "ballet" }
          - { label: "Concert", value: "concert" }
          - { label: "Murder Mystery", value: "murder-mystery" }

      - label: "Audience"
        name: "audience"
        widget: "select"
        options:
          - { label: "Family Friendly", value: "family" }
          - { label: "PG-13", value: "teen" }
          - { label: "Adult", value: "adult" }

      - label: "Price Note"
        name: "price"
        widget: "string"
        required: false
        hint: "Free text, e.g. 'Tickets $24 Adults, $20 Students' or 'On Sale June 1'"

      - label: "Ticket / Details URL"
        name: "ticket_url"
        widget: "string"
        hint: "One link used for both Get Tickets and View Details buttons"

      - label: "Performances"
        name: "performances"
        widget: "list"
        collapsed: true
        summary: "{{fields.weekday}} {{fields.month}} {{fields.day}} {{fields.year}} — {{fields.time}}"
        hint: "Add one entry per performance. The show card lists them in date order. Leave Year blank — it comes from Show Year above."
        fields:
          - label: "Weekday"
            name: "weekday"
            widget: "select"
            options: ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]
          - label: "Month"
            name: "month"
            widget: "select"
            options: ["Jan","Feb","Mar","Apr","May","June","July","Aug","Sept","Oct","Nov","Dec"]
          - label: "Day"
            name: "day"
            widget: "number"
            value_type: "int"
            min: 1
            max: 31
          - label: "Year (only if different from Show Year)"
            name: "year"
            widget: "number"
            value_type: "int"
            required: false
            min: 2025
            max: 2031
            hint: "Leave BLANK. Fill in only when this performance is in a different year than the Show Year — e.g. the January dates of a run that opens in December."
          - label: "Time"
            name: "time"
            widget: "string"
            hint: "e.g. '7:30PM' or '2:00PM' — include AM/PM, no space"
