<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>You're in — Front Row Maryland</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#050608; --gold:#f3c96b; --text:#f7f7f7; --muted:#c9c9d4; --line:rgba(243,201,107,.35); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font-family:"Poppins",system-ui,sans-serif; padding:24px 16px; }
    .card { max-width:520px; width:100%; background:rgba(7,8,12,.92); border:1px solid var(--line); border-radius:18px; padding:36px 32px; text-align:center; }
    .card img { width:96px; height:96px; border-radius:16px; margin-bottom:14px; }
    .eyebrow { color:var(--gold); font-size:12px; letter-spacing:.2em; text-transform:uppercase; font-weight:700; }
    h1 { font-size:30px; margin:12px 0 10px; line-height:1.15; }
    p { color:var(--muted); line-height:1.6; margin:0 0 10px; }
    .btn { display:inline-block; margin-top:18px; background:var(--gold); color:#111; font-weight:700; text-decoration:none; padding:12px 24px; border-radius:999px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="Front Row Logo v5.jpg" alt="Front Row Maryland">
    <div class="eyebrow">Front Row Maryland</div>
    <h1>You're in.</h1>
    <p>Every Monday morning, that weekend's shows across Maryland land in your inbox — dates, times, and ticket links, all in one email.</p>
    <p>Until then, the full calendar is always one click away.</p>
    <a class="btn" href="/">See what's playing</a>
  </div>
</body>
</html>
